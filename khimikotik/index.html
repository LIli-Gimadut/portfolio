<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Химикотик — прототип</title>
  <link rel="stylesheet" href="../assets/style.css?v=training">
  <style>
    main {
      min-block-size: 100vh;
      min-block-size: 100dvh;
      display: grid;
      grid-template-rows: auto minmax(20rem, 1fr);
    }
    .prototype-note { background: var(--violet); }
    .prototype-note .shell {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: .35rem 1.5rem;
      padding-block: .8rem;
    }
    .prototype-note p { color: var(--ink); }
    .prototype-links { display: flex; flex-wrap: wrap; gap: .25rem 1rem; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #14132c; }
  </style>
</head>
<body>
  <main>
    <header class="prototype-note">
      <div class="shell">
        <p><strong>Это прототип, который могу публично показать.</strong> После этой версии я доработала дизайн, адаптировала верстку и ускорила загрузку игры.</p>
        <div class="prototype-links">
          <a href="../#khimikotik">К портфолио</a>
          <a href="https://khimikotik.liliya-gimadutdinova.chatgpt.site/">Открыть игру отдельно</a>
        </div>
      </div>
    </header>
    <iframe
      title="Химикотик — интерактивная химическая лаборатория"
      src="https://khimikotik.liliya-gimadutdinova.chatgpt.site/"
      allow="autoplay; fullscreen"
      allowfullscreen
    ></iframe>
  </main>
</body>
</html>
